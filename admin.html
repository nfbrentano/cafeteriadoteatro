<!-- ═══════════════════════════════════════════════════════════
     LOGIN SCREEN
════════════════════════════════════════════════════════════ -->
<div id="login-screen" role="main" aria-label="Tela de login">
  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo__icon">☕</span>
      <div class="login-logo__title">Cafeteria <span>do Teatro</span></div>
      <div class="login-logo__sub">Área Administrativa</div>
    </div>

    <div class="login-error" id="login-error" role="alert">
      Usuário ou senha incorretos. Tente novamente.
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="login-user">E-mail</label>
        <input class="field__input" type="email" id="login-user"
               placeholder="seu@email.com" autocomplete="username" required />
        <div class="field__error-msg" id="err-login-user">Digite seu e-mail.</div>
      </div>

      <div class="field">
        <label class="field__label" for="login-pass">Senha</label>
        <input class="field__input" type="password" id="login-pass"
               placeholder="••••••••" autocomplete="current-password" required />
        <div class="field__error-msg" id="err-login-pass">Digite sua senha.</div>
      </div>

      <button type="submit" class="btn btn--primary btn--full adm-s-066" id="login-btn">
        Entrar no Painel
      </button>
    </form>
  </div>
</div>
