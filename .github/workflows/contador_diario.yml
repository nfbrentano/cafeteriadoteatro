name: Consolidar Contador Diário e Acessos

on:
  schedule:
    # Executa todos os dias às 03:10 UTC (00:10 Horário de Brasília)
    - cron: '10 3 * * *'
  workflow_dispatch: # Permite rodar manualmente pela aba Actions do GitHub

permissions: {}

jobs:
  consolidar-acessos:
    name: Consolidar Acessos do Dia Anterior
    runs-on: ubuntu-latest
    steps:
      - name: Executar rotina no Supabase via REST API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ SUPABASE_URL e SUPABASE_ANON_KEY devem estar configurados em Variables/Secrets do repositório."
            exit 1
          fi

          echo "Disparando consolidacao do contador no Supabase..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/consolidar_contador_dia_anterior" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Status retornado: $HTTP_STATUS"
          echo "Resposta: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Rotina executada com sucesso e contador atualizado!"
          else
            echo "❌ Erro ao executar a rotina no Supabase."
            exit 1
          fi
